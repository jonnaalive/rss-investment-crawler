name: Investment RSS crawler

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: Discord 연결 테스트만 전송
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: investment-rss-crawler
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Crawl or test Discord
        env:
          RSS_CRAWLER_WEBHOOK_URL: ${{ secrets.RSS_CRAWLER_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.send_test }}" = "true" ]; then
            python crawler.py --send-test
          else
            python crawler.py
          fi
      - name: Save crawler state
        if: ${{ inputs.send_test != true }}
        run: |
          git config user.name "rss-crawler"
          git config user.email "rss-crawler@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "auto: update RSS state"
          git push
